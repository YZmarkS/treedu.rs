name: Attach Linux Release
run-name: Attach Linux Build to Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach to"
        required: true
        type: string

jobs:
  build:
    strategy:
      matrix:
        includes:
          - os: "ubuntu-latest"
            target: "x86_64-unknown-linux-gnu"
            executable_suffix: ""
          - os: "ubuntu-24.04-arm"
            target: "aarch64-unknown-linux-gnu"
            executable_suffix: ""
          - os: "windows-latest"
            executable_suffix: ".exe"
          - os: "windows-11-arm"
            executable_suffix: ".exe"
          - os: "macos-latest"
            executable_suffix: ""
          - os: "macos-15-intel"
            executable_suffix: ""

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: "Rustup: Checking toolchain"
        run: rustup --version
      - name: "Rustup: Add standard library for target platform"
        if: ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}

      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            **/target/
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: "cargo: Building natively for ${{ matrix.os }}"
        if: ${{ matrix.target == null }}
        run: "cargo build --profile release"
      - name: "cargo: Building for ${{ matrix.os }} targetting: ${{ matrix.target}}"
        if: ${{ matrix.target != null }}
        run: "cargo build --profile release --target=${{ matrix.target }}"
        
      - name: "Upload: Upload to release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp target/release/treedu treedu-${{ matrix.os }}${{ matrix.executable_suffix }}
          gh release upload ${{ inputs.tag }} treedu-${{ matrix.os }}${{ matrix.executable_suffix }} --clobber
